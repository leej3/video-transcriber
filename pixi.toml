[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
pip = ">=25.0,<26"
av = ">=14,<19"
librosa = ">=0.11,<1"
scikit-learn = ">=1.6,<2"

[pypi-dependencies]
faster-whisper = ">=1.2,<2"

[tasks]
transcribe = "python tools/transcribe.py"
test = "python -m unittest discover -s tests -p 'test_*.py'"
