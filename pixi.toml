[workspace]
name = "video-transcriber"
version = "0.2.0"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
pre-commit = ">=4.6,<5"
reuse = ">=5,<7"

[tasks]
transcribe = "python .apm/skills/video-transcriber/scripts/launch.py"
doctor = "python .apm/skills/video-transcriber/scripts/launch.py --doctor"
setup = "python .apm/skills/video-transcriber/scripts/launch.py --setup"
license-check = "reuse lint"
test = "python -B -m unittest discover -s tests -p 'test_*.py'"
format = "pre-commit run --all-files"

# Dataset tooling is separate from inference and ordinary unit tests.
[feature.data]
platforms = ["osx-arm64-macos-14-0", "linux-64"]

[feature.data.dependencies]
git = ">=2.55.0,<3"

[feature.data.pypi-dependencies]
datalad = ">=1.2,<2"

[feature.data.target.linux-64.dependencies]
git-annex = "==10.20260601"

[feature.data.target.osx-arm64-macos-14-0.pypi-dependencies]
git-annex = "==10.20260601"

[environments]
default = { features = [] }
data = { features = ["data"] }
